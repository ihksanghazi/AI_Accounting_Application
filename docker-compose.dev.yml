version: '3.8'

services:
  # Layanan Database PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"

  # Layanan Backend AI dengan Python
  ai_service:
    container_name: ai_service
    build:
      context: ./ai_service
      dockerfile: Dockerfile.dev
    volumes:
      - ./ai_service/app:/app  # Untuk live-reloading saat development
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Layanan Frontend Next.js
  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      # Mount kode lokal kita untuk live-reloading
      - ./frontend:/app
      # Pastikan node_modules dari container yang digunakan
      - /app/node_modules
    command: npm run dev # <- Menjalankan server development, bukan produksi

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/app

volumes:
  postgres_data: